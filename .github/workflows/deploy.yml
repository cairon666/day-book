name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web
  API_IMAGE: ghcr.io/${{ github.repository }}/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR требует нижний регистр: приводим OWNER/REPO к lowercase
      - name: Normalize image names
        run: |
          echo "WEB_IMAGE=${WEB_IMAGE,,}" >> "$GITHUB_ENV"
          echo "API_IMAGE=${API_IMAGE,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Порядок этапов гарантирует спецификацию deployment:
      # упавшая сборка любого из образов прерывает job до шага деплоя.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:main
            ${{ env.WEB_IMAGE }}:${{ github.sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:main
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/day-book
            docker compose pull web api
            docker compose up -d
            docker image prune -f
